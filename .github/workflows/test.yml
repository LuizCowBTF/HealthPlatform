name: Tests

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**.pdf'
      - '**.xlsx'
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 bandit
    
    - name: Lint code
      run: |
        flake8 app/backend/src/ --count --max-complexity=10 --max-line-length=127 --statistics --show-source --exclude=__pycache__,migrations,.venv,venv || true
    
    - name: Security check
      run: |
        bandit -r app/backend/src/ -ll || true
    
    - name: Create tests directory
      run: mkdir -p tests
    
    - name: Run tests
      run: |
        if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
          pytest tests/ -v --cov=app/backend/src/ --cov-report=xml --cov-report=term --maxfail=5
        else
          echo "No tests found - skipping"
          exit 0
        fi
      env:
        ENV_FOR_DYNACONF: testing
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      if: success()
      with:
        file: ./coverage.xml
        fail_ci_if_error: false