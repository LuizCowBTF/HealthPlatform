version: '3.8'

services:
  healthplatform:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///health_platform.db
      - APP_ENV=production
    volumes:
      - ./health_platform.db:/app/health_platform.db
      - ./app/frontend:/app/app/frontend
    restart: unless-stopped