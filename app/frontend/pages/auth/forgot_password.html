<!DOCTYPE html>
<html class="light" lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Recuperação de Senha</title>
		<script
			src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
			rel="stylesheet" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet" />
		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							"primary": "#d48262",
							"background-light": "#f5f5f5",
							"background-dark": "#211511",
							"accent": "#1c1c1c",
							"sidebar-bg": "#ffffff"
						},
						fontFamily: {
							"display": ["Inter", "sans-serif"]
						},
						borderRadius: {
							"DEFAULT": "0.5rem",
							"lg": "1rem",
							"xl": "1.5rem",
							"full": "9999px"
						},
					},
				},
			}
		</script>
		<script>
			// Função para expandir/colapsar submenus
			function toggleSubmenu(id) {
				const submenu = document.getElementById(id);
				const icon = document.getElementById(`icon-${id}`);
				if (submenu.classList.contains('hidden')) {
					// Expandir
					submenu.classList.remove('hidden');
					icon.classList.add('rotate-180');
				} else {
					// Colapsar
					submenu.classList.add('hidden');
					icon.classList.remove('rotate-180');
				}
			}

			// Função para colapsar/expandir o sidebar principal
			function toggleSidebar() {
				const expandedSidebar = document.getElementById('expanded-sidebar');
				const recolherSidebar = document.getElementById('recolher-sidebar');
				const mainContent = document.getElementById('main-content');
				
				expandedSidebar.classList.toggle('hidden');
				recolherSidebar.classList.toggle('hidden');
			}
		</script>
	</head>
	    <body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white">
        <div class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden">
            <div class="absolute inset-0 z-0 h-full w-full bg-[radial-gradient(#e5e7eb_1px,transparent_1px)] [background-size:16px_16px] dark:bg-[radial-gradient(#4b5563_1px,transparent_1px)]"></div>
            <div class="relative z-10 flex w-full max-w-md flex-col items-center gap-8 rounded-xl bg-white/50 p-8 shadow-2xl backdrop-blur-lg dark:bg-background-dark/50">
                <div class="flex w-full flex-col items-center gap-2">
                    <div class="flex items-center justify-center">
                        <img src="../../img/LOGO.png" class="size-full" alt="HelathCRM Logo">
                    </div>
                </div>
                <div class="w-full">
                    <form class="flex flex-col gap-4">
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium text-[#171311] dark:text-white">E-mail:</p>
                            <div class="relative flex w-full flex-1 items-center">
                                <input class="form-input h-14 w-full flex-1 resize-none overflow-hidden rounded-xl border border-[#e5dedc] bg-white p-4 pr-12 text-base font-normal text-[#171311] placeholder:text-[#876d64] focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/50 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder:text-gray-400" placeholder="Formato: seu-email@example.com.br" type="email" />
                                <div class="absolute right-4 text-[#876d64] dark:text-gray-400">
                                    <span class="material-symbols-outlined">mail</span>
                                </div>
                            </div>
                        </label>
                        <label class="flex flex-col">
                            <p class="pb-2 text-base font-medium text-[#171311] dark:text-white">Senha:</p>
                            <div class="relative flex w-full flex-1 items-center">
                                <input class="form-input h-14 w-full flex-1 resize-none overflow-hidden rounded-xl border border-[#e5dedc] bg-white p-4 pr-12 text-base font-normal text-[#171311] placeholder:text-[#876d64] focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/50 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder:text-gray-400" placeholder="Digite sua Senha aqui" type="password" />
                                <div class="absolute right-4 text-[#876d64] dark:text-gray-400">
                                    <span class="material-symbols-outlined">lock</span>
                                </div>
                            </div>
                        </label>
                    </form>
                </div>
                <div class="flex w-full flex-col gap-4">
                    <button class="flex h-14 w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl bg-primary text-base font-bold tracking-[0.015em] text-white transition-transform duration-200 hover:scale-105">
                        <span class="truncate">Recuperar</span>
                    </button>
                </div>
            </div>
        </div>
        <script src="../js/iframe-breadcrumb-helper.js"></script>
    </body>
</html>
