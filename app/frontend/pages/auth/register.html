<!DOCTYPE html>
<html class="light" lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Cadastros</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							"primary": "#d48262",
							"background-light": "#f5f5f5",
							"background-dark": "#211511",
							"accent": "#1c1c1c",
							"sidebar-bg": "#ffffff"
						},
						fontFamily: {
							"display": ["Inter", "sans-serif"]
						},
						borderRadius: {
							"DEFAULT": "0.5rem",
							"lg": "1rem",
							"xl": "1.5rem",
							"full": "9999px"
						},
					},
				},
			}
		</script>
        <script>
			// Função para expandir/colapsar submenus
			function toggleSubmenu(id) {
				const submenu = document.getElementById(id);
				const icon = document.getElementById(`icon-${id}`);
				if (submenu.classList.contains('hidden')) {
					// Expandir
					submenu.classList.remove('hidden');
					icon.classList.add('rotate-180');
				} else {
					// Colapsar
					submenu.classList.add('hidden');
					icon.classList.remove('rotate-180');
				}
			}

			// Função para colapsar/expandir o sidebar principal
			function toggleSidebar() {
				const expandedSidebar = document.getElementById('expanded-sidebar');
				const recolherSidebar = document.getElementById('recolher-sidebar');
				const mainContent = document.getElementById('main-content');
				
				expandedSidebar.classList.toggle('hidden');
				recolherSidebar.classList.toggle('hidden');
			}
		</script>
    </head>
    <body
        class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
        <div
            class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 group/design-root">
            <header
                class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center max-w-7xl mx-auto">
                <h1 class="text-2xl font-bold text-primary">HealthCRM</h1>
                <p class="text-base">Already have an account? <a
                        class="font-bold text-primary hover:underline"
                        href="#">Log in</a></p>
            </header>
            <main class="w-full max-w-2xl px-4">
                <div
                    class="bg-card-light dark:bg-card-dark rounded-xl shadow-soft p-8 md:p-12">
                    <div class="text-center mb-8">
                        <p
                            class="text-3xl md:text-4xl font-black tracking-[-0.033em] text-text-light dark:text-text-dark">Create
                            your Account</p>
                        <p
                            class="text-base text-gray-500 dark:text-gray-400 mt-2">Register
                            for HealthCRM</p>
                    </div>
                    <form class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <label class="flex flex-col">
                                <p class="text-base font-medium pb-2">First
                                    Name</p>
                                <div class="relative">
                                    <span
                                        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">person</span>
                                    <input
                                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder-gray-400 pl-11 p-[15px] text-base font-normal transition-colors"
                                        placeholder="Enter your first name"
                                        value />
                                </div>
                            </label>
                            <label class="flex flex-col">
                                <p class="text-base font-medium pb-2">Last
                                    Name</p>
                                <div class="relative">
                                    <span
                                        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">person</span>
                                    <input
                                        class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder-gray-400 pl-11 p-[15px] text-base font-normal transition-colors"
                                        placeholder="Enter your last name"
                                        value />
                                </div>
                            </label>
                        </div>
                        <label class="flex flex-col">
                            <p class="text-base font-medium pb-2">CPF</p>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">badge</span>
                                <input
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder-gray-400 pl-11 p-[15px] text-base font-normal transition-colors"
                                    placeholder="000.000.000-00" value />
                            </div>
                            <!-- <p class="text-error text-sm mt-1">Invalid CPF format.</p> -->
                        </label>
                        <label class="flex flex-col">
                            <p class="text-base font-medium pb-2">Phone</p>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">phone</span>
                                <input
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder-gray-400 pl-11 p-[15px] text-base font-normal transition-colors"
                                    placeholder="Enter your phone number"
                                    value />
                            </div>
                        </label>
                        <label class="flex flex-col">
                            <p class="text-base font-medium pb-2">Email</p>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">mail</span>
                                <input
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border-error h-14 placeholder:text-gray-500 dark:placeholder-gray-400 pl-11 p-[15px] text-base font-normal transition-colors"
                                    placeholder="your.email@example.com"
                                    type="email" value />
                            </div>
                            <p class="text-error text-sm mt-1">Email already in
                                use.</p>
                        </label>
                        <label class="flex flex-col">
                            <p class="text-base font-medium pb-2">Password</p>
                            <div class="relative">
                                <span
                                    class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
                                <input
                                    class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-background-light dark:bg-background-dark focus:border-primary h-14 placeholder:text-gray-500 dark:placeholder-gray-400 pl-11 pr-11 p-[15px] text-base font-normal transition-colors"
                                    placeholder="Enter your password"
                                    type="password" value />
                                <button
                                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary"
                                    type="button">
                                    <span
                                        class="material-symbols-outlined">visibility_off</span>
                                </button>
                            </div>
                        </label>
                        <div class="pt-4">
                            <button
                                class="w-full bg-primary text-white font-bold py-4 px-4 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark transition-all duration-300 ease-in-out flex items-center justify-center"
                                type="submit">
                                Send Registration
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
        <script src="../js/iframe-breadcrumb-helper.js"></script>
    </body>
</html>
