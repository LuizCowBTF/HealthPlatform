<!DOCTYPE html>
<html class="light" lang="pt-BR">

    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Dashboard - Health CRM</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet" />
        <link rel="stylesheet" href="../css/dashboard.css">
        <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }
    </style>
        <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d48262",
                        "background-light": "#f5f5f5",
                        "background-dark": "#211511",
                        "accent": "#1c1c1c",
                        "sidebar-bg": "#ffffff"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
        <script>
        // Função para expandir/colapsar submenus
        function toggleSubmenu(id) {
            const submenu = document.getElementById(id);
            const icon = document.getElementById(`icon-${id}`);
            if (submenu.classList.contains('hidden')) {
                // Expandir
                submenu.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                // Colapsar
                submenu.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // Função para colapsar/expandir o sidebar principal
        function toggleSidebar() {
            const expandedSidebar = document.getElementById('expanded-sidebar');
            const recolherSidebar = document.getElementById('recolher-sidebar');
            const mainContent = document.getElementById('main-content');

            expandedSidebar.classList.toggle('hidden');
            recolherSidebar.classList.toggle('hidden');
        }
    </script>
        <script src="/js/dashboard.js"></script>

    </head>

    <body class="bg-background-light dark:bg-background-dark font-display">
        <!-- Main Content -->
        <div
            class="flex-1 p-4 sm:p-6 lg:p-8 bg-background-light dark:bg-background-dark">
            <h1>🏥 Status do HealthPlatform</h1>

            <div class="status-card status-ok">
                <h3>✅ API Backend</h3>
                <p><strong>Status:</strong> Online</p>
                <p><strong>Versão:</strong> 2.0.0</p>
            </div>

            <div class="status-card status-ok">
                <h3>✅ Frontend</h3>
                <p><strong>Status:</strong> Online</p>
                <p><strong>Dashboard:</strong> Funcionando</p>
            </div>

            <div class="status-card status-ok">
                <h3>✅ Banco de Dados</h3>
                <p><strong>Status:</strong> Conectado</p>
                <p><strong>Tipo:</strong> SQLite</p>
            </div>

            <button onclick="refreshStatus()"
                style="padding:10px 20px; background:#007bff; color:white; border:none; border-radius:5px;">
                🔄 Atualizar Status
            </button>

            <script>
            async function refreshStatus() {
                try {
                    const response = await fetch('/api/health');
                    const data = await response.json();
                    alert(`✅ Sistema funcionando!\nVersão: ${data.version}\nStatus: ${data.status}`);
                } catch (error) {
                    alert('❌ Erro ao verificar status');
                }
            }
        </script>
        </body>

    </html>
