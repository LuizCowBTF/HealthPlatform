<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE VARIÁVEL - Editar em cada dashboard -->
    <title>HealthCRM</title>

    <!-- Ícones do Google -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuração do Tailwind -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e67951",
                        "primary-light": "#f8a583",
                        "primary-dark": "#b86a50",
                        "secondary": "#4299e1",
                        "success": "#48bb78",
                        "warning": "#ed8936",
                        "danger": "#f56565",
                        "info": "#0bc5ea",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211511",
                        "card-light": "#ffffff",
                        "card-dark": "#2a1a14",
                        "text-light": "#1c1c1c",
                        "text-dark": "#f5f5f5",
                        "subtext-light": "#876d64",
                        "subtext-dark": "#a18a82",
                        "border-light": "#e5dedc",
                        "border-dark": "#40312c",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "sans": ["Inter", "system-ui", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
                    }
                },
            },
        }
    </script>

    <!-- CSS PADRÃO PARA TODOS OS DASHBOARDS -->
    <style>
        /* =========================================== */
        /* RESET E ESTILOS GLOBAIS PARA IFRAME */
        /* =========================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100vh !important;
            height: auto !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color, #f8f6f6);
        }

        body.dark {
            --bg-color: #211511;
            --card-color: #2a1a14;
            --text-color: #f5f5f5;
            --border-color: #40312c;
        }

        body.light {
            --bg-color: #f8f6f6;
            --card-color: #ffffff;
            --text-color: #1c1c1c;
            --border-color: #e5dedc;
        }

        /* =========================================== */
        /* CONTAINER PRINCIPAL */
        /* =========================================== */

        .dashboard-container {
            min-height: 1000px !important;
            padding-bottom: 200px !important;
            background: var(--bg-color);
        }

        /* =========================================== */
        /* COMPONENTES PADRÃO DO DASHBOARD */
        /* =========================================== */

        /* CARD PADRÃO */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .mini-card {
            background: var(--card-color);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-card);
            border-left: 4px solid #e67951;
            position: relative;
        }

        .mini-card:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
        }

        /* KPI CARD */
        .kpi-card {
            background: var(--card-color);
            border-radius: 1rem;
            padding: 1.5rem;
            border-left: 4px solid #e67951;
            position: relative;
        }

        .kpi-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #e67951;
            line-height: 1;
        }

        .kpi-label {
            font-size: 0.875rem;
            color: var(--subtext-color);
            margin-top: 0.5rem;
        }

        /* BADGE DE STATUS */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-success {
            background: #dcfce7;
            color: #166534;
        }

        .status-warning {
            background: #fef3c7;
            color: #92400e;
        }

        .status-danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-info {
            background: #dbeafe;
            color: #1e40af;
        }

        /* =========================================== */
        /* BARRA DE ROLAGEM PADRÃO */
        /* =========================================== */

        body::-webkit-scrollbar {
            width: 14px;
        }

        body::-webkit-scrollbar-track {
            background: #f8f9fa;
            border-radius: 8px;
            margin: 4px;
        }

        body::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #e67951, #b86a50);
            border-radius: 8px;
            border: 3px solid #f8f9fa;
        }

        body::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #b86a50, #9c533d);
        }

        /* Firefox */
        body {
            scrollbar-width: auto;
            scrollbar-color: #e67951 #f8f9fa;
        }

        /* =========================================== */
        /* MARCADOR FINAL PADRÃO */
        /* =========================================== */

        .scroll-end-marker {
            height: 200px;
            width: 100%;
            background: linear-gradient(transparent, rgba(230, 121, 81, 0.1));
            border-top: 3px solid #e67951;
            margin-top: 3rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-end-text {
            background: #e67951;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(230, 121, 81, 0.3);
            text-align: center;
        }

        /* =========================================== */
        /* UTILITÁRIOS */
        /* =========================================== */

        .text-gradient {
            background: linear-gradient(135deg, #e67951, #b86a50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .bg-gradient {
            background: linear-gradient(135deg, #e67951, #b86a50);
        }

        .border-gradient {
            border-image: linear-gradient(135deg, #e67951, #b86a50) 1;
        }

        /* =========================================== */
        /* RESPONSIVIDADE */
        /* =========================================== */

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 1rem !important;
            }

            .kpi-value {
                font-size: 2rem;
            }
        }
    </style>
  </head>

  <body class="bg-gray-50 p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
      <!-- ADD BUTTON -->
      <div
        class="grid grid-cols-1 md:grid-cols-1 xl:grid-cols-1 gap-6 m-8 ml-2 mr-5">
        <div
          class="flex items-right gap-2 p-2 justify-end">

            class="flex items-center justify-center gap-2 rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold font-body leading-normal tracking-[0.015em] hover:opacity-90 transition-opacity">
            <span class="material-symbols-outlined text-base">add</span>
            <span class="truncate">Nova Solicitação</span>

      </div>

      <!-- NEW REQUEST -->
      <div
        class="bg-card-light dark:bg-card-dark rounded-lg grid grid-cols-1 md:grid-cols-1 xl:grid-cols-1 gap-6 mb-8 ml-2 mr-5">
        <div
          class="grid grid-cols-1 md:grid-cols-1 xl:grid-cols-3 gap-6 m-8 ml-2 mr-5">
          <div class="flex items-center justify-start">
            <h3
              class="text-text-light dark:text-text-dark text-lg font-semibold">📝
              Nova Requisição</h3>

            <label class="flex flex-col col-span-2">
              <p
                class="text-accent text-primary text-sm font-medium leading-normal pb-2">Nome
                Item / Descrição:</p>
              <input
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-accent dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 placeholder:text-gray-500 dark:placeholder:text-gray-400 p-3 text-base font-normal"
                placeholder="Exemplo: Apple MacBook Pro 16-inch" value />
            </label>
            <label class="flex flex-col">
              <p
                class="text-accent text-primary text-sm font-medium leading-normal pb-2">Categoria:</p>
              <select
                class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-accent dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 placeholder:text-gray-500 dark:placeholder:text-gray-400 px-3 text-base font-normal">

                <option>Equipamentos</option>

                <option>Outros</option>

            </label>
            <label class="flex flex-col">
              <p
                class="text-accent text-primary text-sm font-medium leading-normal pb-2">Quantidade:</p>
              <input
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-accent dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 placeholder:text-gray-500 dark:placeholder:text-gray-400 p-3 text-base font-normal"
                placeholder="1" type="number" value="1" />
            </label>
            <label class="flex flex-col col-span-2">
              <p
                class="text-accent text-primary text-sm font-medium leading-normal pb-2">Fornecedor
                Preferido (Opcional):</p>
              <input
                class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-accent dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-12 placeholder:text-gray-500 dark:placeholder:text-gray-400 p-3 text-base font-normal"
                placeholder="Exemplo Amazon, Apple Store" value />
            </label>
            <label class="flex flex-col col-span-2">
              <p
                class="text-accent text-primary text-sm font-medium leading-normal pb-2">Justificativa:</p>
              <textarea
                class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-accent dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 h-24 placeholder:text-gray-500 dark:placeholder:text-gray-400 p-3 text-base font-normal"
                placeholder="Justifique a compra..."></textarea>
            </label>
            <div class="col-span-2">
              <p
                class="text-accent text-primary text-sm font-medium leading-normal pb-2">Anexos
                (Opcional)</p>
              <div class="flex items-center justify-center w-full">
                <label
                  class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-lg cursor-pointer bg-gray-50 dark:hover:bg-bray-800 dark:bg-gray-700 hover:bg-gray-100 dark:hover:border-gray-500 dark:hover:bg-gray-600 transition-colors"
                  for="dropzone-file">
                  <div
                    class="flex flex-col items-center justify-center pt-5 pb-6">
                    <span
                      class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-4xl">cloud_upload</span>
                    <p
                      class="mb-2 text-sm text-gray-500 dark:text-gray-400">
                      <span class="font-semibold">Clique para Carregar</span>
                      ou
                      <span class="font-semibold">Clique e Arraste</span>
                    </p>
                    <p class="text-xs text-gray-500 dark:text-gray-400">SVG,
                      PNG, JPG or PDF (MAX. 800x400px)</p>
                  </div>
                  <input class="hidden" id="dropzone-file" type="file" />
                </label>
              </div>
            </div>
            <div class="col-span-2 flex justify-end mt-4">
              <button
                class="flex min-w-[120px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary text-white text-base font-bold leading-normal shadow-md hover:opacity-90 transition-opacity"
                type="submit">
                <span class="truncate">Enviar Requisição</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- REQUEST HISTORY -->
      <div

        <div
          class="grid grid-cols-1 md:grid-cols-1 xl:grid-cols-3 gap-6 m-8 ml-2 mr-5">

                        class="font-semibold text-accent dark:text-white">Cadeiras
                        de Escritório (x5)</p>

                        class="text-sm text-gray-500 dark:text-gray-400">Enviado:

                <!-- Empty State Example -->

            </div>

    </div> <!-- Fim do dashboard-container -->

    <!-- =========================================== -->
    <!-- SCRIPT PADRÃO PARA TODOS OS DASHBOARDS -->
    <!-- =========================================== -->
    <script>
            // CONFIGURAÇÃO PADRÃO PARA DASHBOARDS EM IFRAME
            (function () {
                'use strict';

                console.log('📊 Dashboard Template - Carregado');

                // ===========================================
                // 1. VERIFICAR SE ESTÁ DENTRO DE IFRAME
                // ===========================================
                const isInIframe = window.self !== window.top;

                if (isInIframe) {
                    console.log('🎯 Dashboard carregado dentro de iframe');

                    // ===========================================
                    // 2. INICIALIZAÇÃO DO DASHBOARD
                    // ===========================================
                    document.addEventListener('DOMContentLoaded', function () {
                        console.log('✅ DOM totalmente carregado');

                        // Ajustar tema automaticamente
                        adjustTheme();

                        // Garantir altura suficiente para scroll
                        guaranteeScrollHeight();

                        // Configurar componentes dinâmicos
                        setupDynamicComponents();

                        // Informar ao parent que o dashboard está pronto
                        notifyParentDashboardReady();
                    });

                    // ===========================================
                    // 3. FUNÇÕES UTILITÁRIAS
                    // ===========================================

                    /**
                     * Ajusta o tema (claro/escuro) com base no parent
                     */
                    function adjustTheme() {
                        try {
                            const parentTheme = window.parent.document.documentElement.classList.contains('dark')
                                ? 'dark'
                                : 'light';

                            document.body.className = parentTheme;
                            console.log(`🎨 Tema ajustado para: ${parentTheme}`);
                        } catch (e) {
                            console.log('⚠️ Não foi possível detectar tema do parent');
                        }
                    }

                    /**
                     * Garante que o dashboard tenha altura suficiente para scroll
                     */
                    function guaranteeScrollHeight() {
                        setTimeout(() => {
                            const bodyHeight = document.body.scrollHeight;
                            const viewportHeight = window.innerHeight;
                            const minRequiredHeight = viewportHeight + 400;

                            console.log('📏 Verificando altura:', {
                                atual: bodyHeight + 'px',
                                viewport: viewportHeight + 'px',
                                necessária: minRequiredHeight + 'px',
                                precisaExpandir: bodyHeight < minRequiredHeight
                            });

                            // Se necessário, ajustar a área de scroll
                            if (bodyHeight < minRequiredHeight) {
                                const scrollMarker = document.querySelector('.scroll-end-marker');
                                if (scrollMarker) {
                                    const extraHeight = minRequiredHeight - bodyHeight + 100;
                                    scrollMarker.style.height = `${extraHeight}px`;
                                    console.log(`⚡ Área de scroll expandida em ${extraHeight}px`);
                                }
                            }
                        }, 300);
                    }

                    /**
                     * Configura componentes dinâmicos do dashboard
                     */
                    function setupDynamicComponents() {
                        // Adicionar tooltips nos KPIs
                        document.querySelectorAll('.kpi-card').forEach(card => {
                            card.addEventListener('mouseenter', function () {
                                this.style.transform = 'translateY(-4px)';
                            });

                            card.addEventListener('mouseleave', function () {
                                this.style.transform = 'translateY(0)';
                            });
                        });

                        // Configurar tooltips de status
                        document.querySelectorAll('[data-tooltip]').forEach(element => {
                            const tooltipText = element.getAttribute('data-tooltip');
                            if (tooltipText) {
                                element.title = tooltipText;
                            }
                        });

                        console.log('🔧 Componentes dinâmicos configurados');
                    }

                    /**
                     * Informa ao parent que o dashboard está pronto
                     */
                    function notifyParentDashboardReady() {
                        setTimeout(() => {
                            try {
                                const dashboardData = {
                                    type: 'dashboardReady',
                                    title: document.title,
                                    height: document.body.scrollHeight,
                                    url: window.location.href,
                                    timestamp: Date.now()
                                };

                                window.parent.postMessage(dashboardData, '*');
                                console.log('📤 Dashboard notificado como pronto para parent');

                            } catch (e) {
                                console.log('⚠️ Não foi possível notificar parent');
                            }
                        }, 1000);
                    }

                    // ===========================================
                    // 4. ESCUTAR COMANDOS DO PARENT
                    // ===========================================
                    window.addEventListener('message', function (event) {
                        try {
                            const data = event.data;

                            if (data.type === 'refreshDashboard') {
                                console.log('🔄 Parent solicitou refresh do dashboard');
                                // Implementar refresh se necessário
                            }

                            if (data.type === 'updateTheme') {
                                console.log(`🎨 Parent solicitou mudança de tema: ${data.theme}`);
                                document.body.className = data.theme || 'light';
                            }

                        } catch (e) {
                            // Ignorar erros
                        }
                    });

                    // ===========================================
                    // 5. FUNÇÕES GLOBAIS PARA DEBUG
                    // ===========================================

                    // Debug helper
                    window.dashboardDebug = function () {
                        console.group('🔧 DEBUG DO DASHBOARD');
                        console.log('URL:', window.location.href);
                        console.log('Título:', document.title);
                        console.log('Altura body:', document.body.scrollHeight + 'px');
                        console.log('Viewport:', window.innerHeight + 'px');
                        console.log('Tema atual:', document.body.className);
                        console.log('Em iframe:', isInIframe);
                        console.groupEnd();

                        return {
                            height: document.body.scrollHeight,
                            viewport: window.innerHeight,
                            theme: document.body.className,
                            url: window.location.href
                        };
                    };

                    // Forçar recálculo de altura
                    window.recalculateHeight = function () {
                        guaranteeScrollHeight();
                        notifyParentDashboardReady();
                        console.log('📐 Altura recalculada');
                    };

                } else {
                    console.log('🌍 Dashboard carregado diretamente (não em iframe)');
                }

                // ===========================================
                // 6. EXPORTAÇÃO DE FUNÇÕES PÚBLICAS
                // ===========================================
                window.dashboardUtils = {
                    refresh: function () {
                        location.reload();
                    },

                    toggleTheme: function () {
                        const currentTheme = document.body.className;
                        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                        document.body.className = newTheme;
                        console.log(`🎨 Tema alterado para: ${newTheme}`);
                        return newTheme;
                    },

                    getStats: function () {
                        const cards = document.querySelectorAll('.kpi-card, .dashboard-card');
                        const tables = document.querySelectorAll('table');
                        const charts = document.querySelectorAll('[data-chart]');

                        return {
                            totalCards: cards.length,
                            totalTables: tables.length,
                            totalCharts: charts.length,
                            totalHeight: document.body.scrollHeight,
                            theme: document.body.className
                        };
                    }
                };

            })();
    </script>
  </body>

</html>
