<!DOCTYPE html>
<html class="light" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Health CRM as SaaS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#d48262",
            "background-light": "#f5f5f5",
            "background-dark": "#211511",
            "accent": "#1c1c1c",
            "sidebar-bg": "#ffffff"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <script>
    // Função para expandir/colapsar submenus
    function toggleSubmenu(id) {
      const submenu = document.getElementById(id);
      const icon = document.getElementById(`icon-${id}`);
      if (submenu.classList.contains('hidden')) {
        // Expandir
        submenu.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        // Colapsar
        submenu.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    // Função para colapsar/expandir o sidebar principal
    function toggleSidebar() {
      const expandedSidebar = document.getElementById('expanded-sidebar');
      const recolherSidebar = document.getElementById('recolher-sidebar');
      const mainContent = document.getElementById('main-content');

      expandedSidebar.classList.toggle('hidden');
      recolherSidebar.classList.toggle('hidden');
    }
  </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display">

  <div class="flex min-h-screen">
    <main class="p-10">
      <div class="flex flex-wrap justify-between gap-3 mb-8">
        <div class="flex min-w-72 flex-col gap-2">
          <p class="text-text-accent dark:text-white text-3xl font-black leading-tight tracking-[-0.033em]">Register a
            New Expense</p>
          <p class="text-text-accent/60 dark:text-white/60 text-base font-normal">Fill in the details to register a new
            expense for your operations.</p>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Expense Form -->
        <div class="lg:col-span-2 bg-card-bg dark:bg-background-dark p-6 rounded-lg shadow-soft">
          <form class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <label class="flex flex-col min-w-40 flex-1 col-span-1">
              <p class="text-text-accent dark:text-white text-sm font-medium pb-2">Date</p>
              <div class="flex w-full flex-1 items-stretch rounded-lg">
                <input
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-accent dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-border-light dark:border-white/20 bg-white dark:bg-white/5 h-12 placeholder:text-text-accent/60 p-3 text-sm font-normal"
                  placeholder="Select Date" type="date" value="" />
              </div>
            </label>
            <label class="flex flex-col min-w-40 flex-1">
              <p class="text-text-accent dark:text-white text-sm font-medium pb-2">Amount (R$)</p>
              <div class="relative flex w-full flex-1 items-stretch rounded-lg">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3 text-text-accent/60 dark:text-white/60">R$</span>
                <input
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-accent dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-border-light dark:border-white/20 bg-white dark:bg-white/5 h-12 placeholder:text-text-accent/60 p-3 pl-9 text-sm font-normal"
                  placeholder="0,00" value="" />
              </div>
            </label>
            <label class="flex flex-col min-w-40 flex-1">
              <p class="text-text-accent dark:text-white text-sm font-medium pb-2">Category</p>
              <select
                class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-accent dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-border-light dark:border-white/20 bg-white dark:bg-white/5 h-12 placeholder:text-text-accent/60 p-3 text-sm font-normal">
                <option>Office Supplies</option>
                <option>Travel</option>
                <option>Utilities</option>
                <option>Marketing</option>
              </select>
            </label>
            <label class="flex flex-col min-w-40 flex-1">
              <p class="text-text-accent dark:text-white text-sm font-medium pb-2">Cost Center</p>
              <select
                class="form-select flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-accent dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-border-light dark:border-white/20 bg-white dark:bg-white/5 h-12 placeholder:text-text-accent/60 p-3 text-sm font-normal">
                <option>Administration</option>
                <option>Sales Team</option>
                <option>Operations</option>
              </select>
            </label>
            <label class="flex flex-col min-w-40 flex-1 col-span-1 md:col-span-2">
              <p class="text-text-accent dark:text-white text-sm font-medium pb-2">Description</p>
              <textarea
                class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-text-accent dark:text-white focus:outline-0 focus:ring-1 focus:ring-primary border border-border-light dark:border-white/20 bg-white dark:bg-white/5 h-24 placeholder:text-text-accent/60 p-3 text-sm font-normal"
                placeholder="Enter a detailed description..."></textarea>
            </label>
            <div class="flex flex-col min-w-40 flex-1 col-span-1 md:col-span-2">
              <p class="text-text-accent dark:text-white text-sm font-medium pb-2">Attach Receipt</p>
              <div class="flex items-center justify-center w-full">
                <label
                  class="flex flex-col items-center justify-center w-full h-32 border-2 border-border-light dark:border-white/20 border-dashed rounded-lg cursor-pointer bg-background-light dark:bg-white/5 hover:bg-primary/5 dark:hover:bg-primary/10"
                  for="dropzone-file">
                  <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <span
                      class="material-symbols-outlined text-text-accent/60 dark:text-white/60 text-3xl">cloud_upload</span>
                    <p class="mb-2 text-sm text-text-accent/60 dark:text-white/60"><span class="font-semibold">Click to
                        upload</span> or drag and drop</p>
                    <p class="text-xs text-text-accent/60 dark:text-white/60">SVG, PNG, JPG or PDF</p>
                  </div>
                  <input class="hidden" id="dropzone-file" type="file" />
                </label>
              </div>
            </div>
            <div class="flex items-center justify-end gap-3 col-span-1 md:col-span-2 mt-4">
              <button
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-transparent text-text-accent/80 dark:text-white/80 text-sm font-medium hover:bg-primary/10">
                <span class="truncate">Cancel</span>
              </button>
              <button
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-primary text-white text-sm font-medium shadow-soft hover:opacity-90">
                <span class="truncate">Save Expense</span>
              </button>
            </div>
          </form>
        </div>
        <!-- Recent Expenses -->
        <div class="lg:col-span-1">
          <div class="bg-card-bg dark:bg-background-dark p-6 rounded-lg shadow-soft">
            <h3 class="text-lg font-bold text-text-accent dark:text-white mb-4">Recent Expenses</h3>
            <div class="space-y-4">
              <div
                class="flex justify-between items-center p-3 rounded-lg hover:bg-background-light dark:hover:bg-white/5">
                <div>
                  <p class="font-medium text-text-accent dark:text-white">Travel</p>
                  <p class="text-sm text-text-accent/60 dark:text-white/60">15/07/2024</p>
                </div>
                <p class="font-bold text-text-accent dark:text-white">R$ 350,00</p>
              </div>
              <div
                class="flex justify-between items-center p-3 rounded-lg hover:bg-background-light dark:hover:bg-white/5">
                <div>
                  <p class="font-medium text-text-accent dark:text-white">Office Supplies</p>
                  <p class="text-sm text-text-accent/60 dark:text-white/60">14/07/2024</p>
                </div>
                <p class="font-bold text-text-accent dark:text-white">R$ 120,50</p>
              </div>
              <div
                class="flex justify-between items-center p-3 rounded-lg hover:bg-background-light dark:hover:bg-white/5">
                <div>
                  <p class="font-medium text-text-accent dark:text-white">Marketing</p>
                  <p class="text-sm text-text-accent/60 dark:text-white/60">12/07/2024</p>
                </div>
                <p class="font-bold text-text-accent dark:text-white">R$ 800,00</p>
              </div>
              <div
                class="flex justify-between items-center p-3 rounded-lg hover:bg-background-light dark:hover:bg-white/5">
                <div>
                  <p class="font-medium text-text-accent dark:text-white">Utilities</p>
                  <p class="text-sm text-text-accent/60 dark:text-white/60">10/07/2024</p>
                </div>
                <p class="font-bold text-text-accent dark:text-white">R$ 450,75</p>
              </div>
              <div
                class="flex justify-between items-center p-3 rounded-lg hover:bg-background-light dark:hover:bg-white/5">
                <div>
                  <p class="font-medium text-text-accent dark:text-white">Travel</p>
                  <p class="text-sm text-text-accent/60 dark:text-white/60">08/07/2024</p>
                </div>
                <p class="font-bold text-text-accent dark:text-white">R$ 210,00</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  </div>
  </div>
  <script src="../js/iframe-breadcrumb-helper.js"></script>
</body>

</html>
