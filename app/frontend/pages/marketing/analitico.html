<!DOCTYPE html>
<html class="light" lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>HealthCRM Dashboard</title>
        <script
            src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
            rel="stylesheet" />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet" />
        <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .progress-bar {
        transition: width 0.8s ease-in-out;
      }
      .kpi-card:hover {
        transform: translateY(-2px);
        transition: transform 0.2s ease;
      }
      .loading {
        opacity: 0.6;
        pointer-events: none;
      }
      .chart-container {
        position: relative;
        height: 300px;
        width: 100%;
      }
    </style>

        <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e67951",
              "background-light": "#f8f6f6",
              "background-dark": "#211511",
              "card-light": "#ffffff",
              "card-dark": "#2a1a14",
              "text-light": "#1c1c1c",
              "text-dark": "#f5f5f5",
              "subtext-light": "#876d64",
              "subtext-dark": "#a18a82",
              "border-light": "#e5dedc",
              "border-dark": "#40312c",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    </head>
    <body class="bg-background-light dark:bg-background-dark font-display">
        <div class="flex min-h-screen">
            <!-- Main Content -->
            <main class="flex-1 p-6 lg:p-10">
<div class="flex-1 p-8">
<div class="flex flex-wrap justify-between items-center gap-4 mb-8">
<div class="flex flex-col gap-1">
<p class="text-text-light dark:text-text-dark text-3xl font-bold tracking-tight">Financial KPI</p>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal">A comprehensive overview of key financial metrics</p>
</div>
<div class="flex items-center gap-2">
<label class="flex items-center cursor-pointer" for="accounting-sync">
<span class="mr-3 text-sm font-medium text-text-light dark:text-text-dark">Sync with Accounting</span>
<div class="relative">
<input class="sr-only peer" id="accounting-sync" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-primary"></div>
</div>
</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6 mb-8">
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">
<p class="text-gray-500 dark:text-gray-400 text-base font-medium">Cash In</p>
<p class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold">R$ 2.5M</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">
<p class="text-gray-500 dark:text-gray-400 text-base font-medium">Cash Out</p>
<p class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold">R$ 1.3M</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">
<p class="text-gray-500 dark:text-gray-400 text-base font-medium">Total Expenses</p>
<p class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold">R$ 225K</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">
<p class="text-gray-500 dark:text-gray-400 text-base font-medium">Gross Margin</p>
<p class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold">48%</p>
</div>
<div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">
<p class="text-gray-500 dark:text-gray-400 text-base font-medium">Net Margin</p>
<p class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold">39%</p>
</div>
</div>
<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
<div class="lg:col-span-2 bg-white dark:bg-[#2a201c] rounded-xl p-6 shadow-sm">
<h3 class="text-lg font-semibold text-text-light dark:text-text-dark mb-4">Historical Cash on Hand</h3>
<div class="h-96">
<canvas id="cashFlowChart"></canvas>
</div>
</div>
<div class="bg-white dark:bg-[#2a201c] rounded-xl p-6 shadow-sm">
<h3 class="text-lg font-semibold text-text-light dark:text-text-dark mb-4">Cost Centers Breakdown</h3>
<div class="flex flex-col gap-4">
<div class="flex justify-between items-center">
<span class="text-sm font-medium text-gray-600 dark:text-gray-300">Salaries</span>
<span class="text-sm font-semibold text-text-light dark:text-text-dark">R$ 95K</span>
</div>
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 42.2%"></div>
</div>
<div class="flex justify-between items-center">
<span class="text-sm font-medium text-gray-600 dark:text-gray-300">Marketing</span>
<span class="text-sm font-semibold text-text-light dark:text-text-dark">R$ 50K</span>
</div>
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 22.2%"></div>
</div>
<div class="flex justify-between items-center">
<span class="text-sm font-medium text-gray-600 dark:text-gray-300">Technology</span>
<span class="text-sm font-semibold text-text-light dark:text-text-dark">R$ 45K</span>
</div>
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 20%"></div>
</div>
<div class="flex justify-between items-center">
<span class="text-sm font-medium text-gray-600 dark:text-gray-300">Administrative</span>
<span class="text-sm font-semibold text-text-light dark:text-text-dark">R$ 35K</span>
</div>
<div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2.5">
<div class="bg-primary h-2.5 rounded-full" style="width: 15.6%"></div>
</div>
</div>
</div>
</div>
</div>
</main>
</div>
</div>
<script>
    const ctx = document.getElementById('cashFlowChart');
    if (ctx) {
        const cashFlowChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'Cash on Hand (R$)',
                    data: [500000, 520000, 510000, 550000, 580000, 620000, 650000, 680000, 720000, 750000, 780000, 820000],
                    borderColor: '#d48262',
                    backgroundColor: 'rgba(212, 130, 98, 0.2)',
                    tension: 0.4,
                    fill: true,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false,
                    },
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        ticks: {
                            callback: function(value, index, values) {
                                return 'R$ ' + (value / 1000) + 'K';
                            }
                        }
                    }
                }
            }
        });
    }
</script>

</body>
</html>
