<!DOCTYPE html>
<html class="light" lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Health CRM as SaaS</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#d48262",
            "background-light": "#f5f5f5",
            "background-dark": "#211511",
            "accent": "#1c1c1c",
            "sidebar-bg": "#ffffff"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
  <script>
    // Função para expandir/colapsar submenus
    function toggleSubmenu(id) {
      const submenu = document.getElementById(id);
      const icon = document.getElementById(`icon-${id}`);
      if (submenu.classList.contains('hidden')) {
        // Expandir
        submenu.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        // Colapsar
        submenu.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    // Função para colapsar/expandir o sidebar principal
    function toggleSidebar() {
      const expandedSidebar = document.getElementById('expanded-sidebar');
      const recolherSidebar = document.getElementById('recolher-sidebar');
      const mainContent = document.getElementById('main-content');

      expandedSidebar.classList.toggle('hidden');
      recolherSidebar.classList.toggle('hidden');
    }
  </script>
</head>

<body class="bg-background-light dark:bg-background-dark font-display">

  <div class="flex min-h-screen">
    <!-- Main Content -->
    <div class="flex-1 p-8">
      <!-- PageHeading -->
      <div class="flex flex-wrap justify-between items-center gap-4 mb-8">
        <div class="flex flex-col gap-1">
          <p class="text-text-light dark:text-text-dark text-3xl font-bold tracking-tight">Financial KPI</p>

        <div class="flex items-center gap-2">

        <div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">

        </div>
        <div class="flex flex-col gap-2 rounded-xl p-6 bg-white dark:bg-[#2a201c] shadow-sm">

          <p class="text-text-light dark:text-text-dark tracking-tight text-3xl font-bold">R$ 975K</p>
        </div>
      </div>
      <!-- Chart Section -->

            <button
              class="flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-lg bg-background-light dark:bg-background-dark pl-4 pr-3 text-text-light dark:text-text-dark hover:bg-gray-200 dark:hover:bg-gray-700">
              <p class="text-sm font-medium">Month</p>

              <p class="text-sm font-medium">Product</p>

            </button>
          </div>

            <button

            <button

              <span class="material-symbols-outlined text-base">picture_as_pdf</span>
              <p class="text-sm font-medium">Export to PDF</p>
            </button>
          </div>
        </div>
        <!-- Bar Chart -->
        <div class="h-96 flex items-end gap-4 px-4">

            <p class="text-xs text-gray-500 dark:text-gray-400">Broker A</p>
          </div>
          <div class="flex flex-col items-center gap-2 h-full flex-1">
            <div class="w-full h-1/2 bg-primary/30 dark:bg-primary/50 rounded-lg transition-all hover:bg-primary"
              style="height: 50%"></div>
            <p class="text-xs text-gray-500 dark:text-gray-400">Broker B</p>
          </div>
          <div class="flex flex-col items-center gap-2 h-full flex-1">
            <div class="w-full h-5/6 bg-primary/30 dark:bg-primary/50 rounded-lg transition-all hover:bg-primary"

            <p class="text-xs text-gray-500 dark:text-gray-400">Broker C</p>

          </div>
          <div class="flex flex-col items-center gap-2 h-full flex-1">

              style="height: 66.67%"></div>

          </div>

            <p class="text-xs text-gray-500 dark:text-gray-400">Broker F</p>
          </div>
          <div class="flex flex-col items-center gap-2 h-full flex-1">
            <div class="w-full h-4/5 bg-primary/30 dark:bg-primary/50 rounded-lg transition-all hover:bg-primary"
              style="height: 80%"></div>
            <p class="text-xs text-gray-500 dark:text-gray-400">Broker G</p>
          </div>
        </div>
      </div>
    </div>
    </main>
  </div>
  </div>
</body>

</html>
