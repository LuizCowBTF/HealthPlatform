<!DOCTYPE html>
<html class="light" lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Comissões - Health Platform</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .progress-bar {
        transition: width 0.8s ease-in-out;
      }
      .kpi-card:hover {
        transform: translateY(-2px);
        transition: transform 0.2s ease;
      }
      .loading {
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#e67951",
              "background-light": "#f8f6f6",
              "background-dark": "#211511",
              "card-light": "#ffffff",
              "card-dark": "#2a1a14",
              "text-light": "#1c1c1c",
              "text-dark": "#f5f5f5",
              "subtext-light": "#876d64",
              "subtext-dark": "#a18a82",
              "border-light": "#e5dedc",
              "border-dark": "#40312c",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-background-light dark:bg-background-dark font-display">
    <div class="flex min-h-screen">
      <!-- Sidebar Navigation -->
      <aside
        class="w-64 bg-card-light dark:bg-card-dark flex-col justify-between hidden lg:flex"
      >
        <div class="p-6">
          <div class="flex flex-col">
            <div class="flex items-center">
              <div class="bg-center">
                <img
                  class="w-full max-w-48"
                  src="/static/img/logo_crm.png"
                  alt="Health Platform Logo"
                />
              </div>
            </div>
          </div>
          <div class="flex items-center gap-6 p-8">
            <div class="flex flex-col items-center p-2">
              <div class="flex items-center">
                <div
                  class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                  data-alt="Admin profile picture"
                >
                  <h1
                    class="text-text-light dark:text-text-dark text-base font-medium leading-normal"
                  >
                    Admin
                  </h1>
                  <p
                    class="text-subtext-light dark:text-subtext-dark text-sm font-normal leading-normal"
                  >
                    Administrador
                  </p>
                </div>
              </div>
            </div>
          </div>
          <nav class="mt-6 flex flex-col gap-2">
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-subtext-light dark:text-subtext-dark hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20"
              href="/dashboard"
            >
              <span class="material-symbols-outlined">dashboard</span>
              <span class="text-sm font-medium">Dashboard</span>
            </a>
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-subtext-light dark:text-subtext-dark hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20"
              href="/clientes"
            >
              <span class="material-symbols-outlined">group</span>
              <span class="text-sm font-medium">Clientes</span>
            </a>
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-subtext-light dark:text-subtext-dark hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20"
              href="leads"
            >
              <span class="material-symbols-outlined">leaderboard</span>
              <span class="text-sm font-medium">Leads</span>
            </a>
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/20 text-primary"
              href="/comissoes"
            >
              <span class="material-symbols-outlined">paid</span>
              <span class="text-sm font-medium">Comissões</span>
            </a>
            <a
              class="flex items-center gap-3 px-3 py-2 rounded-lg text-subtext-light dark:text-subtext-dark hover:bg-primary/10 hover:text-primary dark:hover:bg-primary/20"
              href="relatorios"
            >
              <span class="material-symbols-outlined">assessment</span>
              <span class="text-sm font-medium">Relatórios</span>
            </a>
          </nav>
        </div>
      </aside>

      <div class="flex-1 flex flex-col">
        <!-- Top Navigation Bar -->
        <header
          class="bg-card-light dark:bg-card-dark border-b border-border-light dark:border-border-dark flex items-center justify-between p-4 sticky top-0 z-10"
        >
          <div class="flex items-center gap-4">
            <button class="lg:hidden text-text-light dark:text-text-dark">
              <span class="material-symbols-outlined">menu</span>
            </button>
          </div>
          <div class="flex items-center gap-4">
            <div class="relative w-64 hidden md:block">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-subtext-light dark:text-subtext-dark"
                >search</span
              >
              <input
                class="form-input w-full pl-10 pr-4 py-2 rounded-lg bg-background-light dark:bg-background-dark border-transparent focus:border-primary focus:ring-primary text-sm text-text-light dark:text-text-dark placeholder-subtext-light dark:placeholder-subtext-dark"
                placeholder="Buscar corretores, planos..."
                type="text"
                id="searchInput"
              />
            </div>
            <button
              class="relative text-subtext-light dark:text-subtext-dark hover:text-text-light dark:hover:text-text-dark"
            >
              <span class="material-symbols-outlined">notifications</span>
              <span
                class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-primary ring-2 ring-card-light dark:ring-card-dark"
              ></span>
            </button>
            <div class="flex items-center gap-2">
              <div
                class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                data-alt="Admin profile picture"
                style="background-color: #e67951; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;"
              >
                A
              </div>
            </div>
          </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-4 sm:p-6 lg:p-8 bg-background-light dark:bg-background-dark">
		
		
		
	    </main>
      </div>
	</div>
	
	<script>
	
	</script>
  </body>
</html>
