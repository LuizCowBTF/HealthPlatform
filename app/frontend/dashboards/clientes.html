<!DOCTYPE html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- TITLE VARIÁVEL - Editar em cada dashboard -->
    <title>HealthCRM</title>

    <!-- Ícones do Google -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuração do Tailwind -->
    <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#e67951",
            "primary-light": "#f8a583",
            "primary-dark": "#b86a50",
            "secondary": "#4299e1",
            "success": "#48bb78",
            "warning": "#ed8936",
            "danger": "#f56565",
            "info": "#0bc5ea",
            "background-light": "#f8f6f6",
            "background-dark": "#211511",
            "card-light": "#ffffff",
            "card-dark": "#2a1a14",
            "text-light": "#1c1c1c",
            "text-dark": "#f5f5f5",
            "subtext-light": "#876d64",
            "subtext-dark": "#a18a82",
            "border-light": "#e5dedc",
            "border-dark": "#40312c",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"],
            "sans": ["Inter", "system-ui", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.75rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "2xl": "2rem",
            "full": "9999px"
          },
          boxShadow: {
            'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05)',
          }
        },
      },
    }
  </script>

    <!-- CSS PADRÃO PARA TODOS OS DASHBOARDS -->
    <style>
    /* =========================================== */
    /* RESET E ESTILOS GLOBAIS PARA IFRAME */
    /* =========================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh !important;
      height: auto !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      font-family: 'Inter', sans-serif;
      background: var(--bg-color, #f8f6f6);
    }

    body.dark {
      --bg-color: #211511;
      --card-color: #2a1a14;
      --text-color: #f5f5f5;
      --border-color: #40312c;
    }

    body.light {
      --bg-color: #f8f6f6;
      --card-color: #ffffff;
      --text-color: #1c1c1c;
      --border-color: #e5dedc;
    }

    /* =========================================== */
    /* CONTAINER PRINCIPAL */
    /* =========================================== */

    .dashboard-container {
      min-height: 1000px !important;
      padding-bottom: 200px !important;
      background: var(--bg-color);
    }

    /* =========================================== */
    /* COMPONENTES PADRÃO DO DASHBOARD */
    /* =========================================== */

    /* CARD PADRÃO */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }

    .mini-card {
      background: var(--card-color);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-color);
      transition: all 0.3s ease;
    }

    .mini-card:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-2px);
    }

    /* KPI CARD */
    .kpi-card {
      background: var(--card-color);
      border-radius: 1rem;
      padding: 1.5rem;
      border-left: 4px solid #e67951;
      position: relative;
    }

    .kpi-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #e67951;
      line-height: 1;
    }

    .kpi-label {
      font-size: 0.875rem;
      color: var(--subtext-color);
      margin-top: 0.5rem;
    }

    /* BADGE DE STATUS */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-success {
      background: #dcfce7;
      color: #166534;
    }

    .status-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .status-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-info {
      background: #dbeafe;
      color: #1e40af;
    }

    /* =========================================== */
    /* BARRA DE ROLAGEM PADRÃO */
    /* =========================================== */

    body::-webkit-scrollbar {
      width: 14px;
    }

    body::-webkit-scrollbar-track {
      background: #f8f9fa;
      border-radius: 8px;
      margin: 4px;
    }

    body::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #e67951, #b86a50);
      border-radius: 8px;
      border: 3px solid #f8f9fa;
    }

    body::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, #b86a50, #9c533d);
    }

    /* Firefox */
    body {
      scrollbar-width: auto;
      scrollbar-color: #e67951 #f8f9fa;
    }

    /* =========================================== */
    /* MARCADOR FINAL PADRÃO */
    /* =========================================== */

    .scroll-end-marker {
      height: 200px;
      width: 100%;
      background: linear-gradient(transparent, rgba(230, 121, 81, 0.1));
      border-top: 3px solid #e67951;
      margin-top: 3rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scroll-end-text {
      background: #e67951;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(230, 121, 81, 0.3);
      text-align: center;
    }

    /* =========================================== */
    /* UTILITÁRIOS */
    /* =========================================== */

    .text-gradient {
      background: linear-gradient(135deg, #e67951, #b86a50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .bg-gradient {
      background: linear-gradient(135deg, #e67951, #b86a50);
    }

    .border-gradient {
      border-image: linear-gradient(135deg, #e67951, #b86a50) 1;
    }

    /* =========================================== */
    /* RESPONSIVIDADE */
    /* =========================================== */

    @media (max-width: 768px) {
      .dashboard-container {
        padding: 1rem !important;
      }

      .kpi-value {
        font-size: 2rem;
      }
    }
  </style>
  </head>

  <body class="bg-gray-50 p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
      <div class="flex-1 space-y-2">
        <!-- Page Heading & Actions -->
        <div
          class="flex flex-col md:flex-row justify-between items-start md:items-center gap-1">
          <div class="flex gap-1">
            <button
              class="flex items-center justify-center gap-2 rounded-lg px-4 bg-white dark:bg-gray-700 border border-border-light dark:border-border-dark text-sm font-semibold shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600">
              <span class="material-symbols-outlined text-base">download</span>
              <span>Exportar .XLSX</span>
            </button>
            <button
              class="flex items-center justify-center gap-2 rounded-lg px-4 bg-white dark:bg-gray-700 border border-border-light dark:border-border-dark text-sm font-semibold shadow-sm hover:bg-gray-50 dark:hover:bg-gray-600">
              <span class="material-symbols-outlined text-base">download</span>
              <span>Exportar .CSV</span>
            </button>
          </div>
        </div>

        <!-- Filter Bar Card -->
        <div
          class="bg-card-light dark:bg-card-dark p-4 rounded-lg shadow-sm border border-border-light dark:border-border-dark">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Coluna 1 -->
            <div class="space-y-4">
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Período</p>
                <input
                  class="form-input w-full flex flex-1 overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent placeholder:text-gray-500 px-3 py-2 text-sm"
                  placeholder="Selecionar período" type="text"
                  id="periodFilter" />
              </label>
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Status</p>
                <select
                  class="form-select w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent px-3 py-2 text-sm"
                  id="statusFilter">
                  <option value>Todos</option>
                  <option>Ativo</option>
                  <option>Pendente</option>
                  <option>Cancelado</option>
                </select>
              </label>
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Email</p>
                <input
                  class="form-input w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent placeholder:text-gray-500 px-3 py-2 text-sm"
                  placeholder="ex: cliente@email.com" type="text"
                  id="emailFilter" />
              </label>
            </div>

            <!-- Coluna 2 -->
            <div class="space-y-4">
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Categoria do Plano</p>
                <select
                  class="form-select w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent px-3 py-2 text-sm"
                  id="categoryFilter">
                  <option value>Todos</option>
                  <option>Plano de Saúde</option>
                  <option>Plano Odontológico</option>
                </select>
              </label>
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Nome do Cliente</p>
                <input
                  class="form-input w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent placeholder:text-gray-500 px-3 py-2 text-sm"
                  placeholder="ex: João Silva" type="text"
                  id="clientNameFilter" />
              </label>
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Corretor</p>
                <select
                  class="form-select w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent px-3 py-2 text-sm"
                  id="brokerFilter">
                  <option value>Todos</option>
                  <option>João Silva</option>
                  <option>Maria Santos</option>
                  <option>Pedro Oliveira</option>
                </select>
              </label>
            </div>

            <!-- Coluna 3 -->
            <div class="space-y-4">
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Origem</p>
                <select
                  class="form-select w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent px-3 py-2 text-sm"
                  id="originFilter">
                  <option value>Todas</option>
                  <option>Online</option>
                  <option>Indicação</option>
                </select>
              </label>
              <label class="flex flex-col">
                <p class="text-sm font-medium pb-2">Número do Contrato</p>
                <input
                  class="form-input w-full flex flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary border border-border-light dark:border-border-dark bg-transparent placeholder:text-gray-500 px-3 py-2 text-sm"
                  placeholder="ex: C12345" type="text" id="contractFilter" />
              </label>
              <!-- Botões ocupando o mesmo espaço que os inputs acima -->
              <div class="flex flex-col justify-end h-[42px]">
                <div class="flex gap-2">
                  <button
                    class="flex-1 flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-gray-200 dark:bg-gray-600 text-text-light dark:text-text-dark text-sm font-semibold leading-normal tracking-[0.015em] hover:bg-gray-300 dark:hover:bg-gray-500"
                    id="clearFilters">
                    <span class="truncate">Limpar Filtros</span>
                  </button>
                  <button
                    class="flex-1 flex cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 bg-primary text-white text-sm font-semibold leading-normal tracking-[0.015em] hover:bg-primary/90"
                    id="applyFilters">
                    <span class="truncate">Aplicar Filtros</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Data Table Card -->
        <div
          class="bg-card-light dark:bg-card-dark rounded-lg shadow-sm border border-border-light dark:border-border-dark overflow-hidden">
          <div
            class="p-4 flex justify-between items-center border-b border-border-light dark:border-border-dark">
            <label class="flex flex-col min-w-40 !h-10 max-w-sm">
              <div class="flex w-full flex-1 items-stretch rounded-lg h-full">
                <div
                  class="text-gray-500 flex bg-gray-100 dark:bg-gray-700 items-center justify-center pl-3 rounded-l-lg border-r-0">
                  <span class="material-symbols-outlined">search</span>
                </div>
                <input
                  class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-0 focus:ring-0 border-none bg-gray-100 dark:bg-gray-700 focus:border-none h-full placeholder:text-gray-500 dark:placeholder:text-gray-400 px-4 rounded-l-none border-l-0 pl-2 text-sm font-normal leading-normal"
                  placeholder="Buscar na tabela..." value id="tableSearch" />
              </div>
            </label>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
              <thead
                class="text-xs text-gray-500 dark:text-gray-400 uppercase bg-gray-50 dark:bg-gray-700/50">
                <tr>
                  <th class="px-6 py-3 font-semibold" scope="col">
                    Cliente
                  </th>
                  <th class="px-6 py-3 font-semibold" scope="col">
                    Nº Contrato
                  </th>
                  <th class="px-6 py-3 font-semibold" scope="col">
                    Produto
                  </th>
                  <th class="px-6 py-3 font-semibold" scope="col">
                    Categoria
                  </th>
                  <th class="px-6 py-3 font-semibold" scope="col">Valor</th>
                  <th class="px-6 py-3 font-semibold" scope="col">Data</th>
                  <th class="px-6 py-3 font-semibold" scope="col">
                    Status
                  </th>
                </tr>
              </thead>
              <tbody id="clientsTableBody">
                <!-- Dados serão carregados via JavaScript -->
              </tbody>
            </table>
          </div>
          <!-- Pagination -->
          <div class="p-4 space-y-4">
            <div class="w-full text-center">
              <span class="text-gray-500 dark:text-gray-400 text-sm"
                id="paginationInfo">Carregando...</span>
            </div>
            <div class="w-full flex justify-center">
              <div class="inline-flex items-center -space-x-px"
                id="paginationContainer">
                <!-- Paginação será gerada via JavaScript -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div> <!-- Fim do dashboard-container -->

    <!-- =========================================== -->
    <!-- SCRIPT PADRÃO PARA TODOS OS DASHBOARDS -->
    <!-- =========================================== -->
    <script>
      // CONFIGURAÇÃO PADRÃO PARA DASHBOARDS EM IFRAME
      (function () {
        'use strict';

        console.log('📊 Dashboard Template - Carregado');

        // ===========================================
        // 1. VERIFICAR SE ESTÁ DENTRO DE IFRAME
        // ===========================================
        const isInIframe = window.self !== window.top;

        if (isInIframe) {
          console.log('🎯 Dashboard carregado dentro de iframe');

          // ===========================================
          // 2. INICIALIZAÇÃO DO DASHBOARD
          // ===========================================
          document.addEventListener('DOMContentLoaded', function () {
            console.log('✅ DOM totalmente carregado');

            // Ajustar tema automaticamente
            adjustTheme();

            // Garantir altura suficiente para scroll
            guaranteeScrollHeight();

            // Configurar componentes dinâmicos
            setupDynamicComponents();

            // Informar ao parent que o dashboard está pronto
            notifyParentDashboardReady();
          });

          // ===========================================
          // 3. FUNÇÕES UTILITÁRIAS
          // ===========================================

          /**
           * Ajusta o tema (claro/escuro) com base no parent
           */
          function adjustTheme() {
            try {
              const parentTheme = window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';

              document.body.className = parentTheme;
              console.log(`🎨 Tema ajustado para: ${parentTheme}`);
            } catch (e) {
              console.log('⚠️ Não foi possível detectar tema do parent');
            }
          }

          /**
           * Garante que o dashboard tenha altura suficiente para scroll
           */
          function guaranteeScrollHeight() {
            setTimeout(() => {
              const bodyHeight = document.body.scrollHeight;
              const viewportHeight = window.innerHeight;
              const minRequiredHeight = viewportHeight + 400;

              console.log('📏 Verificando altura:', {
                atual: bodyHeight + 'px',
                viewport: viewportHeight + 'px',
                necessária: minRequiredHeight + 'px',
                precisaExpandir: bodyHeight < minRequiredHeight
              });

              // Se necessário, ajustar a área de scroll
              if (bodyHeight < minRequiredHeight) {
                const scrollMarker = document.querySelector('.scroll-end-marker');
                if (scrollMarker) {
                  const extraHeight = minRequiredHeight - bodyHeight + 100;
                  scrollMarker.style.height = `${extraHeight}px`;
                  console.log(`⚡ Área de scroll expandida em ${extraHeight}px`);
                }
              }
            }, 300);
          }

          /**
           * Configura componentes dinâmicos do dashboard
           */
          function setupDynamicComponents() {
            // Adicionar tooltips nos KPIs
            document.querySelectorAll('.kpi-card').forEach(card => {
              card.addEventListener('mouseenter', function () {
                this.style.transform = 'translateY(-4px)';
              });

              card.addEventListener('mouseleave', function () {
                this.style.transform = 'translateY(0)';
              });
            });

            // Configurar tooltips de status
            document.querySelectorAll('[data-tooltip]').forEach(element => {
              const tooltipText = element.getAttribute('data-tooltip');
              if (tooltipText) {
                element.title = tooltipText;
              }
            });

            console.log('🔧 Componentes dinâmicos configurados');
          }

          /**
           * Informa ao parent que o dashboard está pronto
           */
          function notifyParentDashboardReady() {
            setTimeout(() => {
              try {
                const dashboardData = {
                  type: 'dashboardReady',
                  title: document.title,
                  height: document.body.scrollHeight,
                  url: window.location.href,
                  timestamp: Date.now()
                };

                window.parent.postMessage(dashboardData, '*');
                console.log('📤 Dashboard notificado como pronto para parent');

              } catch (e) {
                console.log('⚠️ Não foi possível notificar parent');
              }
            }, 1000);
          }

          // ===========================================
          // 4. ESCUTAR COMANDOS DO PARENT
          // ===========================================
          window.addEventListener('message', function (event) {
            try {
              const data = event.data;

              if (data.type === 'refreshDashboard') {
                console.log('🔄 Parent solicitou refresh do dashboard');
                // Implementar refresh se necessário
              }

              if (data.type === 'updateTheme') {
                console.log(`🎨 Parent solicitou mudança de tema: ${data.theme}`);
                document.body.className = data.theme || 'light';
              }

            } catch (e) {
              // Ignorar erros
            }
          });

          // ===========================================
          // 5. FUNÇÕES GLOBAIS PARA DEBUG
          // ===========================================

          // Debug helper
          window.dashboardDebug = function () {
            console.group('🔧 DEBUG DO DASHBOARD');
            console.log('URL:', window.location.href);
            console.log('Título:', document.title);
            console.log('Altura body:', document.body.scrollHeight + 'px');
            console.log('Viewport:', window.innerHeight + 'px');
            console.log('Tema atual:', document.body.className);
            console.log('Em iframe:', isInIframe);
            console.groupEnd();

            return {
              height: document.body.scrollHeight,
              viewport: window.innerHeight,
              theme: document.body.className,
              url: window.location.href
            };
          };

          // Forçar recálculo de altura
          window.recalculateHeight = function () {
            guaranteeScrollHeight();
            notifyParentDashboardReady();
            console.log('📐 Altura recalculada');
          };

        } else {
          console.log('🌍 Dashboard carregado diretamente (não em iframe)');
        }

        // ===========================================
        // 6. EXPORTAÇÃO DE FUNÇÕES PÚBLICAS
        // ===========================================
        window.dashboardUtils = {
          refresh: function () {
            location.reload();
          },

          toggleTheme: function () {
            const currentTheme = document.body.className;
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.body.className = newTheme;
            console.log(`🎨 Tema alterado para: ${newTheme}`);
            return newTheme;
          },

          getStats: function () {
            const cards = document.querySelectorAll('.kpi-card, .dashboard-card');
            const tables = document.querySelectorAll('table');
            const charts = document.querySelectorAll('[data-chart]');

            return {
              totalCards: cards.length,
              totalTables: tables.length,
              totalCharts: charts.length,
              totalHeight: document.body.scrollHeight,
              theme: document.body.className
            };
          }
        };

      })();
  </script>
  <script src="../js//iframe-breadcrumb-helper.js"></script>
  </body>
