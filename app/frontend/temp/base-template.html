<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard Geral - HealthCRM</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
            rel="stylesheet">

        <!-- Tailwind -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "primary": "#e67951",
                            "background-light": "#f8f6f6",
                            "background-dark": "#211511",
                            "card-light": "#ffffff",
                            "card-dark": "#2a1a14",
                            "text-light": "#1c1c1c",
                            "text-dark": "#f5f5f5",
                            "subtext-light": "#876d64",
                            "subtext-dark": "#a18a82",
                            "border-light": "#e5dedc",
                            "border-dark": "#40312c",
                        },
                        fontFamily: {
                            "display": ["Inter", "sans-serif"]
                        },
                        borderRadius: {
                            "DEFAULT": "0.5rem",
                            "lg": "1rem",
                            "xl": "1.5rem",
                            "full": "9999px"
                        },
                    },
                },
            }
        </script>

        <!-- CSS para garantir scroll no iframe -->
        <style>
        /* ESTILOS CRÍTICOS PARA IFRAME */
            html,
            body {
                min-height: 1200px !important;
                height: auto !important;
                overflow-y: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                padding-bottom: 200px !important;
            }

            .max-w-7xl {
                min-height: 1000px !important;
                padding-bottom: 150px !important;
            }

            /* Barra de rolagem estilizada */
            body::-webkit-scrollbar {
                width: 14px;
            }

            body::-webkit-scrollbar-track {
                background: #f8f9fa;
                border-radius: 8px;
                margin: 4px;
            }

            body::-webkit-scrollbar-thumb {
                background: linear-gradient(135deg, #d48262, #b86a50);
                border-radius: 8px;
                border: 3px solid #f8f9fa;
            }

            body::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(135deg, #b86a50, #9c533d);
            }

            /* Área final para garantir scroll */
            .scroll-end-area {
                height: 300px;
                width: 100%;
                background: linear-gradient(transparent, rgba(212, 130, 98, 0.1));
                border-top: 2px solid #d48262;
                margin-top: 50px;
                position: relative;
            }

            .scroll-end-area::before {
                content: "🏁 FIM DO CONTEÚDO 🏁";
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: #d48262;
                color: white;
                padding: 10px 25px;
                border-radius: 25px;
                font-weight: bold;
                font-size: 14px;
            }
        </style>
    </head>

    <body class="bg-gray-50 p-4 md:p-6">
        <div class="max-w-7xl mx-auto">
            <!-- CONTAINER PRINCIPAL DA PÁGINA -->
        </div>
        <script>
        // Verificar se está dentro de iframe
            if (window.self !== window.top) {
                console.log('📦 Dashboard carregado em iframe');
                
                // Garantir altura suficiente
                document.addEventListener('DOMContentLoaded', function() {
                    const bodyHeight = document.body.scrollHeight;
                    const viewportHeight = window.innerHeight;
                    
                    console.log('📏 Alturas:', {
                        body: bodyHeight + 'px',
                        viewport: viewportHeight + 'px'
                    });
                    
                    // Se necessário, expandir mais
                    if (bodyHeight < viewportHeight + 300) {
                        const scrollArea = document.querySelector('.scroll-end-area');
                        if (scrollArea) {
                            scrollArea.style.height = (viewportHeight + 400 - bodyHeight) + 'px';
                            console.log('⚡ Área de scroll ajustada');
                        }
                    }
                    
                    // Informar ao parent que carregamos
                    setTimeout(() => {
                        try {
                            window.parent.postMessage({
                                type: 'iframeLoaded',
                                page: 'dashboard.html',
                                height: document.body.scrollHeight
                            }, '*');
                        } catch(e) {
                            // Ignorar cross-origin
                        }
                    }, 500);
                });
            }
        </script>
    </body>
</html>
